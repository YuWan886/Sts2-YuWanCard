name: Build Mod Package

on:
  push:
    branches: [main]
    paths-ignore:
      - 'wiki/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Mod
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Prepare mod package
        shell: bash
        run: |
          pkg_dir="publish/YuWanCard"
          mkdir -p "$pkg_dir/YuWanCard/localization"

          output_dir="bin/Release/net9.0"

          # DLL + PDB
          cp "$output_dir/YuWanCard.dll" "$pkg_dir/" 2>/dev/null || \
            find bin/Release -name "YuWanCard.dll" -exec cp {} "$pkg_dir/" \;
          cp "$output_dir/YuWanCard.pdb" "$pkg_dir/" 2>/dev/null || \
            find bin/Release -name "YuWanCard.pdb" -exec cp {} "$pkg_dir/" \; || true

          # PCK (packed assets from BSchneppe.StS2.PckPacker)
          cp "$output_dir/YuWanCard.pck" "$pkg_dir/" 2>/dev/null || \
            find bin/Release -name "YuWanCard.pck" -exec cp {} "$pkg_dir/" \; || true

          # Manifest
          cp YuWanCard.json "$pkg_dir/"

          # README
          test -f README.md && cp README.md "$pkg_dir/"

          # Localization (loose JSONs, in case the game loads them from disk)
          cp -r YuWanCard/localization/* "$pkg_dir/YuWanCard/localization/"

          # Raw images (if any are not packed via .import, include them too)
          if [ -d "YuWanCard/images" ]; then
            mkdir -p "$pkg_dir/YuWanCard/images"
            find YuWanCard/images -type f ! -name "*.import" -exec cp --parents {} "$pkg_dir/" \;
          fi

          echo "Package contents:"
          find "$pkg_dir" -type f | sort

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: YuWanCard-${{ github.sha }}
          path: publish/YuWanCard/**
          if-no-files-found: error
          retention-days: 30

      - name: Create zip
        shell: bash
        run: |
          cd publish
          zip -r ../YuWanCard.zip YuWanCard/

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: YuWanCard-${{ github.sha }}-zip
          path: YuWanCard.zip
          if-no-files-found: error
          retention-days: 30
